name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg d "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/shop-window.zip" \
            '.version=$v | .download=$d' module.json > tmp.json && mv tmp.json module.json
      - name: Zip
        run: zip -r shop-window.zip module.json scripts templates styles lang README.md LICENSE
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" module.json shop-window.zip --clobber
