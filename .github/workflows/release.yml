name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set version in manifest
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          jq --arg v "$VERSION" --arg d "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/shop-window.zip" \
            '.version=$v | .download=$d' module.json > tmp.json && mv tmp.json module.json
      - name: Zip
        run: |
          mkdir shop-window && cp -r module.json scripts templates styles lang README.md LICENSE shop-window/
          zip -r shop-window.zip shop-window
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" module.json shop-window.zip --clobber
